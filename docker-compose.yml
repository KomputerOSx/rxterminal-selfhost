# RxTerminal self-hosted.
#
#   cp .env.example .env        # set APP_HOST at least
#   docker compose up -d
#
# Optional profiles (combine with --profile, or COMPOSE_PROFILES=https,backup in .env):
#   https     Caddy reverse proxy with automatic Let's Encrypt certificates (ports 80/443)
#   backup    Litestream continuous replication of the SQLite database to S3-compatible storage
#   postgres  A bundled PostgreSQL instead of SQLite (also set DATABASE_URL, see .env.example)

name: rxterminal

services:
  app:
    image: ${RXTERMINAL_IMAGE:-ghcr.io/komputerosx/rxterminal-selfhost:latest}
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      # Background jobs run inside the web process, so one container is enough.
      SOLID_QUEUE_IN_PUMA: "true"
    ports:
      # Set APP_BIND=127.0.0.1 when using the https profile so only Caddy is public.
      - "${APP_BIND:-0.0.0.0}:${APP_PORT:-3000}:80"
    volumes:
      # SQLite databases, uploaded files and storage/secrets.env (the encryption keys!).
      - storage:/rails/storage
    depends_on:
      postgres:
        condition: service_healthy
        required: false

  caddy:
    profiles: [https]
    image: caddy:2
    restart: unless-stopped
    env_file: .env
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

  litestream:
    profiles: [backup]
    image: litestream/litestream:0.3.13
    restart: unless-stopped
    env_file: .env
    command: replicate -config /etc/litestream.yml
    volumes:
      - storage:/rails/storage
      - ./docker/litestream.yml:/etc/litestream.yml:ro
    depends_on:
      - app

  postgres:
    profiles: [postgres]
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: rxterminal
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_DB: rxterminal
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rxterminal -d rxterminal"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  storage:
  caddy_data:
  caddy_config:
  postgres_data:
