<!doctype html>
<html lang="en">
  <head>
    <title>The change you wanted was rejected (422 Unprocessable Entity)</title>
    <meta charset="utf-8">
    <meta name="viewport" content="initial-scale=1, width=device-width">
    <meta name="robots" content="noindex, nofollow">
    <style>
      @font-face {
        font-family: "Mogilte";
        src: url("/fonts/Mogilte.woff2") format("woff2"),
             url("/fonts/Mogilte.woff") format("woff");
        font-weight: normal;
        font-style: normal;
        font-display: swap;
      }

      *, *::before, *::after { box-sizing: border-box; }
      * { margin: 0; }

      body {
        background: #1c1917;
        color: #e7e5e4;
        display: grid;
        font-family: Roboto, ui-sans-serif, system-ui, -apple-system, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
        line-height: 1.5;
        min-height: 100dvh;
        place-items: center;
        padding: 16px;
      }

      main { max-width: 28rem; text-align: center; }

      .rx-terminal-brand {
        display: inline-block;
        font-family: "Mogilte", Georgia, "Times New Roman", serif;
        font-size: 2.25rem;
        font-weight: normal;
        letter-spacing: -0.01em;
        color: #ffffff;
        text-decoration: none;
      }
      .rx-terminal-brand .rx { color: #004fe0; }
      .rx-terminal-brand:hover { opacity: 0.9; }

      .code { margin-top: 1.5rem; font-size: 3rem; font-weight: 700; color: #ffffff; }
      h1 { margin-top: 0.75rem; font-size: 1.5rem; font-weight: 600; color: #ffffff; }
      p.message { margin-top: 0.75rem; font-size: 0.875rem; color: rgba(231, 229, 228, 0.6); }

      .home {
        display: inline-block;
        margin-top: 2rem;
        padding: 0.4rem 1rem;
        border: 1px solid rgba(231, 229, 228, 0.3);
        border-radius: 0.5rem;
        color: #e7e5e4;
        font-size: 0.875rem;
        font-weight: 600;
        text-decoration: none;
      }
      .home:hover { background: rgba(231, 229, 228, 0.08); }
    </style>
  </head>
  <body>
    <!-- This file lives in public/422.html -->
    <main>
      <a href="/" class="rx-terminal-brand"><span class="rx">Rx</span>Terminal</a>
      <p class="code">422</p>
      <h1>Change rejected</h1>
      <p class="message">Maybe you tried to change something you didn't have access to.</p>
      <a href="/" class="home">Go home</a>
    </main>
  </body>
</html>
