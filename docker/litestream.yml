# Used by the "backup" profile: continuously replicates the SQLite database to S3-compatible
# storage (AWS S3, Backblaze B2, MinIO, ...). Configure LITESTREAM_* in .env.
# Uploaded files (logos) and storage/secrets.env are NOT in the SQLite database - back those up too.
dbs:
  - path: /rails/storage/production.sqlite3
    replicas:
      - url: ${LITESTREAM_REPLICA_URL}
        access-key-id: ${LITESTREAM_ACCESS_KEY_ID}
        secret-access-key: ${LITESTREAM_SECRET_ACCESS_KEY}
