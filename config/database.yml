# SQLite for development/test and for Solid Cache/Queue/Cable in all environments.
# Production primary (application data) is SQLite in storage/ by default, or any database
# Rails can infer from DATABASE_URL (e.g. postgres://...).
#
default_sqlite: &default_sqlite
  adapter: sqlite3
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  timeout: 5000

development:
  primary:
    <<: *default_sqlite
    database: storage/development.sqlite3
  queue:
    <<: *default_sqlite
    database: storage/development_queue.sqlite3
    migrations_paths: db/queue_migrate
  cable:
    <<: *default_sqlite
    database: storage/development_cable.sqlite3
    migrations_paths: db/cable_migrate

test:
  primary:
<% if ENV["TEST_DATABASE_URL"].present? %>
    # CI runs the suite against PostgreSQL too: TEST_DATABASE_URL=postgres://user:pass@host/db
    url: <%= ENV["TEST_DATABASE_URL"] %>
    pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
<% else %>
    <<: *default_sqlite
    database: storage/test.sqlite3
<% end %>
  queue:
    <<: *default_sqlite
    database: storage/test_queue.sqlite3
    migrations_paths: db/queue_migrate

production:
  primary:
<% if ENV["DATABASE_URL"].present? %>
    url: <%= ENV["DATABASE_URL"] %>
    pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
<% else %>
    <<: *default_sqlite
    database: storage/production.sqlite3
<% end %>
  cache:
    <<: *default_sqlite
    database: storage/production_cache.sqlite3
    migrations_paths: db/cache_migrate
  queue:
    <<: *default_sqlite
    database: storage/production_queue.sqlite3
    migrations_paths: db/queue_migrate
  cable:
    <<: *default_sqlite
    database: storage/production_cable.sqlite3
    migrations_paths: db/cable_migrate
